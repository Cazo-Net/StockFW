<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="800" fill="#080b11" />

  <!-- Window Container -->
  <g transform="translate(0, 0)" filter="url(#window-shadow)">
    <rect width="1280" height="800" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />

    <!-- Title Bar -->
    <path d="M 1 40 L 1279 40" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="1280" height="40" rx="12" fill="#0f172a" />
    <rect x="0" y="20" width="1280" height="20" fill="#0f172a" />

    <!-- Window Dots -->
    <g transform="translate(16, 14)">
      <circle cx="6" cy="6" r="6" fill="#ef4444" />
      <circle cx="26" cy="6" r="6" fill="#f59e0b" />
      <circle cx="46" cy="6" r="6" fill="#10b981" />
    </g>

    <text x="80" y="25" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="0.5">StockFW Nexora Desktop v2.4.1</text>

    <!-- Title Right -->
    <g transform="translate(1040, 10)">
      <rect x="0" y="2" width="120" height="20" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
      <text x="60" y="16" fill="#34d399" font-size="11" font-weight="500" text-anchor="middle">AEGIS-ML Active</text>
      <text x="145" y="16" fill="#64748b" font-size="12">SEC-ZONE-01</text>
    </g>

    <!-- Sidebar -->
    <g transform="translate(0, 40)">
      <rect width="240" height="760" fill="#0f172a" />
      <path d="M 240 0 L 240 760" stroke="#1e293b" stroke-width="1" />

      <!-- Brand -->
      <g transform="translate(20, 20)">
        <rect width="32" height="32" rx="8" fill="url(#brand-grad)" />
        <text x="16" y="22" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">N</text>
        <text x="44" y="14" fill="#f8fafc" font-size="15" font-weight="700">NEXORA</text>
        <text x="44" y="28" fill="#64748b" font-size="11">StockFW Security</text>
      </g>

      <!-- Nav Section 1 -->
      <g transform="translate(12, 80)">
        <text x="12" y="12" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.8">OVERVIEW</text>

        <!-- Dashboard (Active) -->
        <g transform="translate(0, 24)">
          <rect width="216" height="38" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1" />
          <path d="M 14 13 L 16 11 M 16 11 L 21 16 M 16 11 V 21 M 10 17 H 22" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(2, 2)"/>
          <text x="40" y="24" fill="#60a5fa" font-size="13" font-weight="500">Dashboard</text>
        </g>

        <!-- Threat Analytics -->
        <g transform="translate(0, 66)">
          <rect width="216" height="38" rx="8" fill="transparent" />
          <path d="M 12 19 V 10 M 16 19 V 6 M 20 19 V 13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="translate(1, 0)" />
          <text x="40" y="24" fill="#94a3b8" font-size="13">Threat Analytics</text>
        </g>

        <!-- Open Connections -->
        <g transform="translate(0, 108)">
          <rect width="216" height="38" rx="8" fill="transparent" />
          <circle cx="16" cy="19" r="6" stroke="#94a3b8" stroke-width="2" fill="none" />
          <path d="M 12 15 C 14 17 18 17 20 15" stroke="#94a3b8" stroke-width="2" fill="none" />
          <text x="40" y="24" fill="#94a3b8" font-size="13">Open Connections</text>
        </g>
      </g>

      <!-- Nav Section 2 -->
      <g transform="translate(12, 260)">
        <text x="12" y="12" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.8">INTELLIGENCE</text>

        <!-- AEGIS-ML Drift -->
        <g transform="translate(0, 24)">
          <rect width="216" height="38" rx="8" fill="transparent" />
          <path d="M 12 12 L 15 17 H 10 L 13 22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(1, 0)" />
          <text x="40" y="24" fill="#94a3b8" font-size="13">AEGIS-ML Drift</text>
        </g>

        <!-- Incident Logs -->
        <g transform="translate(0, 66)">
          <rect width="216" height="38" rx="8" fill="transparent" />
          <path d="M 12 11 V 13 M 12 17 H 12.01 M 5 19 H 19 A 2 2 0 0 0 21 17 V 7 A 2 2 0 0 0 19 5 H 5 A 2 2 0 0 0 3 7 V 17 A 2 2 0 0 0 5 19 Z" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(1, 0)" />
          <text x="40" y="24" fill="#94a3b8" font-size="13">Incident Logs</text>
        </g>
      </g>

      <!-- Sidebar Footer -->
      <g transform="translate(12, 670)">
        <rect width="216" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="31" cy="29" r="16" fill="#3b82f6" />
        <text x="31" y="33" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">AX</text>
        <text x="60" y="25" fill="#f1f5f9" font-size="13" font-weight="600">Admin Officer</text>
        <text x="60" y="42" fill="#64748b" font-size="11">Level 4 Clearance</text>
      </g>
    </g>

    <!-- Content Area -->
    <g transform="translate(240, 40)">
      <rect width="1040" height="760" fill="#0b0f19" />

      <!-- Header Row -->
      <g transform="translate(24, 24)">
        <text x="0" y="20" fill="#f8fafc" font-size="22" font-weight="700">Security Command Center</text>
        <text x="0" y="42" fill="#64748b" font-size="13">Real-time telemetry, threat detection, and active connection monitoring.</text>

        <!-- Action Buttons -->
        <g transform="translate(710, 5)">
          <!-- Sync Telemetry -->
          <g transform="translate(0, 0)" cursor="pointer">
            <rect width="128" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
            <path d="M 14 12 V 15 H 17 M 22 15 A 4 4 0 0 0 14 11 M 14 11 V 8 M 10 18 A 4 4 0 0 0 18 22 M 18 22 V 25" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(2, -4)" />
            <text x="36" y="22" fill="#cbd5e1" font-size="13" font-weight="500">Sync Telemetry</text>
          </g>

          <!-- Deploy Countermeasures -->
          <g transform="translate(140, 0)" cursor="pointer">
            <rect width="166" height="34" rx="6" fill="#3b82f6" />
            <path d="M 14 11 H 20 M 17 8 V 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" transform="translate(2, 2)" />
            <text x="36" y="22" fill="#ffffff" font-size="13" font-weight="500">Deploy Countermeasures</text>
          </g>
        </g>
      </g>

      <!-- Threat Cards Grid -->
      <g transform="translate(24, 96)">
        <!-- Card 1: Critical -->
        <g transform="translate(0, 0)">
          <rect width="320" height="150" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
          <path d="M 0 0 V 150" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

          <g transform="translate(16, 16)">
            <text x="0" y="10" fill="#f87171" font-size="12" font-weight="600" letter-spacing="0.5">CRITICAL VECTOR</text>
            <text x="288" y="10" fill="#64748b" font-size="11" text-anchor="end">2m ago</text>

            <text x="0" y="38" fill="#f1f5f9" font-size="14" font-weight="600">Unauthorized Root Probe</text>
            <text x="0" y="60" fill="#94a3b8" font-size="12" width="280">Multiple sequential exploit attempts detected against core auth daemon via port 443.</text>

            <g transform="translate(0, 100)">
              <line x1="0" y1="0" x2="288" y2="0" stroke="#1f2937" stroke-width="1" />
              <text x="0" y="20" fill="#64748b" font-size="11">Source: 185.220.101.4</text>
              <g transform="translate(230, 8)">
                <rect width="58" height="18" rx="4" fill="rgba(239, 68, 68, 0.15)" />
                <text x="29" y="13" fill="#f87171" font-size="11" font-weight="500" text-anchor="middle">Blocked</text>
              </g>
            </g>
          </g>
        </g>

        <!-- Card 2: High -->
        <g transform="translate(336, 0)">
          <rect width="320" height="150" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
          <path d="M 0 0 V 150" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

          <g transform="translate(16, 16)">
            <text x="0" y="10" fill="#fbbf24" font-size="12" font-weight="600" letter-spacing="0.5">HIGH PRIORITY</text>
            <text x="288" y="10" fill="#64748b" font-size="11" text-anchor="end">14m ago</text>

            <text x="0" y="38" fill="#f1f5f9" font-size="14" font-weight="600">Memory Drift Anomaly</text>
            <text x="0" y="60" fill="#94a3b8" font-size="12">AEGIS-ML detected non-standard allocation pattern in process buffer #0x84FF.</text>

            <g transform="translate(0, 100)">
              <line x1="0" y1="0" x2="288" y2="0" stroke="#1f2937" stroke-width="1" />
              <text x="0" y="20" fill="#64748b" font-size="11">Module: nexora_core.dll</text>
              <g transform="translate(210, 8)">
                <rect width="78" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)" />
                <text x="39" y="13" fill="#fbbf24" font-size="11" font-weight="500" text-anchor="middle">Quarantined</text>
              </g>
            </g>
          </g>
        </g>

        <!-- Card 3: Medium -->
        <g transform="translate(672, 0)">
          <rect width="320" height="150" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
          <path d="M 0 0 V 150" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />

          <g transform="translate(16, 16)">
            <text x="0" y="10" fill="#60a5fa" font-size="12" font-weight="600" letter-spacing="0.5">MEDIUM ALERT</text>
            <text x="288" y="10" fill="#64748b" font-size="11" text-anchor="end">42m ago</text>

            <text x="0" y="38" fill="#f1f5f9" font-size="14" font-weight="600">Encrypted Tunnel Spike</text>
            <text x="0" y="60" fill="#94a3b8" font-size="12">Unrecognized outbound TLS handshake pattern with unknown external endpoint.</text>

            <g transform="translate(0, 100)">
              <line x1="0" y1="0" x2="288" y2="0" stroke="#1f2937" stroke-width="1" />
              <text x="0" y="20" fill="#64748b" font-size="11">Protocol: HTTPS/TLSv1.3</text>
              <g transform="translate(216, 8)">
                <rect width="72" height="18" rx="4" fill="rgba(59, 130, 246, 0.15)" />
                <text x="36" y="13" fill="#60a5fa" font-size="11" font-weight="500" text-anchor="middle">Monitoring</text>
              </g>
            </g>
          </g>
        </g>
      </g>

      <!-- Lower Section -->
      <g transform="translate(24, 262)">
        <!-- Open Connections Panel (2/3 width = 648px) -->
        <g transform="translate(0, 0)">
          <rect width="648" height="434" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />

          <!-- Panel Header -->
          <g transform="translate(16, 16)">
            <path d="M 12 2 A 10 10 0 1 0 22 12 A 10 10 0 0 0 12 2 Z M 2 12 H 22 M 12 2 C 15 5 15 19 12 22 C 9 19 9 5 12 2 Z" stroke="#f1f5f9" stroke-width="2" fill="none" transform="scale(0.7)" />
            <text x="28" y="14" fill="#f1f5f9" font-size="14" font-weight="600">Open Connections &amp; Sessions</text>
            <text x="616" y="14" fill="#3b82f6" font-size="12" font-weight="500" text-anchor="end" cursor="pointer">View All (48 Active)</text>
          </g>

          <line x1="0" y1="48" x2="648" y2="48" stroke="#1f2937" stroke-width="1" />

          <!-- Table Header -->
          <g transform="translate(0, 48)">
            <rect width="648" height="36" fill="#0f172a" />
            <text x="20" y="23" fill="#64748b" font-size="12" font-weight="600">Endpoint IP</text>
            <text x="220" y="23" fill="#64748b" font-size="12" font-weight="600">Protocol</text>
            <text x="370" y="23" fill="#64748b" font-size="12" font-weight="600">State / Status</text>
            <text x="520" y="23" fill="#64748b" font-size="12" font-weight="600">Bytes In/Out</text>
            <line x1="0" y1="36" x2="648" y2="36" stroke="#1f2937" stroke-width="1" />
          </g>

          <!-- Row 1 -->
          <g transform="translate(0, 84)">
            <text x="20" y="23" fill="#38bdf8" font-size="12" font-family="monospace">10.142.55.12:64211</text>
            <text x="220" y="23" fill="#cbd5e1" font-size="12">TCP / Secure</text>
            <circle cx="376" cy="19" r="3" fill="#10b981" />
            <text x="390" y="23" fill="#cbd5e1" font-size="12">Established</text>
            <text x="520" y="23" fill="#cbd5e1" font-size="12">1.4 MB / 840 KB</text>
            <line x1="0" y1="40" x2="648" y2="40" stroke="#1f2937" stroke-width="1" />
          </g>

          <!-- Row 2 -->
          <g transform="translate(0, 124)">
            <text x="20" y="23" fill="#38bdf8" font-size="12" font-family="monospace">192.168.1.104:443</text>
            <text x="220" y="23" fill="#cbd5e1" font-size="12">HTTPS / TLS1.3</text>
            <circle cx="376" cy="19" r="3" fill="#10b981" />
            <text x="390" y="23" fill="#cbd5e1" font-size="12">Encrypted</text>
            <text x="520" y="23" fill="#cbd5e1" font-size="12">14.8 MB / 4.2 MB</text>
            <line x1="0" y1="40" x2="648" y2="40" stroke="#1f2937" stroke-width="1" />
          </g>

          <!-- Row 3 -->
          <g transform="translate(0, 164)">
            <text x="20" y="23" fill="#38bdf8" font-size="12" font-family="monospace">172.16.8.92:8080</text>
            <text x="220" y="23" fill="#cbd5e1" font-size="12">HTTP / Proxy</text>
            <circle cx="376" cy="19" r="3" fill="#f59e0b" />
            <text x="390" y="23" fill="#cbd5e1" font-size="12">High Latency</text>
            <text x="520" y="23" fill="#cbd5e1" font-size="12">512 KB / 120 KB</text>
            <line x1="0" y1="40" x2="648" y2="40" stroke="#1f2937" stroke-width="1" />
          </g>

          <!-- Row 4 -->
          <g transform="translate(0, 204)">
            <text x="20" y="23" fill="#38bdf8" font-size="12" font-family="monospace">185.220.101.4:9001</text>
            <text x="220" y="23" fill="#cbd5e1" font-size="12">RAW / TCP</text>
            <circle cx="376" cy="19" r="3" fill="#ef4444" />
            <text x="390" y="23" fill="#cbd5e1" font-size="12">Terminated</text>
            <text x="520" y="23" fill="#cbd5e1" font-size="12">4 KB / 0 KB</text>
          </g>
        </g>

        <!-- AEGIS-ML Drift Panel (1/3 width = 360px, x = 664) -->
        <g transform="translate(664, 0)">
          <rect width="376" height="434" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />

          <!-- Panel Header -->
          <g transform="translate(16, 16)">
            <path d="M 13 10 V 3 L 4 14 h 7 v 7 l 9 -11 h -7 z" stroke="#f1f5f9" stroke-width="2" fill="none" transform="scale(0.7)" />
            <text x="28" y="14" fill="#f1f5f9" font-size="14" font-weight="600">AEGIS-ML Drift Status</text>
            <text x="344" y="14" fill="#3b82f6" font-size="12" font-weight="500" text-anchor="end" cursor="pointer">Config</text>
          </g>

          <line x1="0" y1="48" x2="376" y2="48" stroke="#1f2937" stroke-width="1" />

          <!-- Body -->
          <g transform="translate(16, 64)">
            <!-- Metric 1 -->
            <g transform="translate(0, 0)">
              <rect width="344" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
              <text x="14" y="28" fill="#64748b" font-size="12">Model Confidence</text>
              <text x="330" y="28" fill="#34d399" font-size="15" font-weight="700" font-family="monospace" text-anchor="end">99.42%</text>
            </g>

            <!-- Metric 2 -->
            <g transform="translate(0, 58)">
              <rect width="344" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
              <text x="14" y="28" fill="#64748b" font-size="12">Drift Divergence</text>
              <text x="330" y="28" fill="#fbbf24" font-size="15" font-weight="700" font-family="monospace" text-anchor="end">0.0184 Δ</text>
            </g>

            <!-- Drift Chart Container -->
            <g transform="translate(0, 116)">
              <rect width="344" height="95" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
              <g transform="translate(12, 16)">
                <text x="0" y="0" fill="#64748b" font-size="11">Drift History (24h)</text>
                <text x="320" y="0" fill="#64748b" font-size="11" text-anchor="end">Stable</text>

                <g transform="translate(0, 12)">
                  <!-- Chart SVG -->
                  <svg class="chart-svg" viewBox="0 0 320 50" width="320" height="50">
                    <path d="M 0 38 Q 50 30 100 35 T 200 18 T 290 25 L 320 22 L 320 50 L 0 50 Z" fill="url(#chart-grad)" />
                    <path d="M 0 38 Q 50 30 100 35 T 200 18 T 290 25 L 320 22" fill="none" stroke="#3b82f6" stroke-width="2" />
                  </svg>
                </g>
              </g>
            </g>

            <!-- Status Row -->
            <g transform="translate(0, 223)">
              <rect width="344" height="38" rx="6" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" />
              <text x="14" y="24" fill="#34d399" font-size="12">Inference Engine</text>
              <text x="330" y="24" fill="#34d399" font-size="12" font-weight="bold" text-anchor="end">Optimal</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
