<!doctype html>
<html lang="en" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title_full}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="{{title_full}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<link rel="icon" href="{{root}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/site.css">
{{extra_css}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{main}}
</main>
{{> footer}}
{{> search}}
<script src="{{root}}assets/js/site.js" defer></script>
{{extra_js}}
</body>
</html>
