        run: |
          smokes="fs-simviz-smoke fs-theme-smoke fs-trustview-smoke"
          ninja -C build-linux $smokes
          for t in $smokes; do
            echo "== $t"
            xvfb-run -a "./build-linux/$t"
          done

      - name: One instance, background start and --quit (real binary)
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
        run: |
          ninja -C build-linux StockFW
          xvfb-run -a bash tests/test-instance.sh

  linux-smokes-2:
    name: Linux UI smokes group 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev \
            librsvg2-common shared-mime-info fonts-dejavu-core \
            iptables nftables xvfb xauth \
            xdotool stalonetray desktop-file-utils \
            liblzma-dev libssl-dev xz-utils \
            python3-location location libloc-database clang libclang-rt-dev \
            nsis gcc-mingw-w64-x86-64 libgtk-3-bin strace

      - name: Build
        run: |
          cmake -S port -B port/build-linux -G Ninja
          ninja -C port/build-linux

      - name: UI smoke tests group 2
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
        run: |
          smokes="fs-copilot-smoke fs-statusview-smoke fs-activity-smoke
                  fs-overview-place-smoke fs-verdict-smoke fs-startup-smoke"
          ninja -C build-linux $smokes
          for t in $smokes; do
            echo "== $t"
            xvfb-run -a "./build-linux/$t"
          done

      - name: No tray (Broadway, as on Wayland and WSL) and stray words (real binary)
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
          STOCKFW_NOTRAY_REQUIRE: "1"
        run: |
          ninja -C build-linux StockFW fs-prefs-fake-smoke
          bash tests/test-notray.sh

      - name: Start at sign-in (XDG autostart entry)
        working-directory: port
        run: |
          bash tests/test-autostart.sh

  linux-smokes-3:
    name: Linux UI smokes group 3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev \
            librsvg2-common shared-mime-info fonts-dejavu-core \
            iptables nftables xvfb xauth \
            xdotool stalonetray desktop-file-utils \
            liblzma-dev libssl-dev xz-utils \
            python3-location location libloc-database clang libclang-rt-dev \
            nsis gcc-mingw-w64-x86-64 libgtk-3-bin strace

      - name: Build
        run: |
          cmake -S port -B port/build-linux -G Ninja
          ninja -C port/build-linux

      - name: UI smoke tests group 3
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
        run: |
          smokes="fs-traymenu-smoke fs-session-smoke
                  fs-help-smoke fs-intelview-smoke fs-whatif-start-smoke
                  fs-sentinel-test"
          ninja -C build-linux $smokes
          for t in $smokes; do
            echo "== $t"
            xvfb-run -a "./build-linux/$t"
          done

  linux-live:
    name: Linux live firewall and tarball tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev \
            librsvg2-common shared-mime-info fonts-dejavu-core \
            iptables nftables xvfb xauth \
            xdotool stalonetray desktop-file-utils \
            liblzma-dev libssl-dev xz-utils \
            python3-location location libloc-database clang libclang-rt-dev \
            nsis gcc-mingw-w64-x86-64 libgtk-3-bin strace

      - name: Build
        run: |
          cmake -S port -B port/build-linux -G Ninja
          ninja -C port/build-linux

      - name: Live firewall tests as root, each in a private network namespace
        working-directory: port
        run: |
          strict () {
            local log rc
            log="$(mktemp)"
            sudo bash "$1" > "$log" 2>&1 && rc=0 || rc=$?
            cat "$log"
            if grep -q '^SKIP' "$log"; then
              echo "::error::$1 was skipped on CI"
              return 1
            fi
            if [ "${2:-}" = parts ] && grep -q '^skip:' "$log"; then
              echo "::error::$1 skipped root-only checks on CI"
              return 1
            fi
            return "$rc"
          }
          ninja -C build-linux fs-nftset-load fs-intelset-driver \
            fs-intel-backend-driver fs-intel-e2e-driver stockfw-intel-test \
            fs-fetch-test fs-hostnet-test
          d="$PWD"
          while [ "$d" != / ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          strict tests/test-apply-linux.sh
          strict tests/test-apply-dual.sh
          strict tests/test-nftset.sh
          strict tests/test-whatif-live.sh
          strict tests/test-logstart-events.sh
          strict tests/test-logstart-kmsg.sh
          strict tests/test-intelset.sh
          strict tests/test-intel-backend.sh
          strict tests/test-intel-e2e.sh
          strict tests/test-intel-cli.sh
          strict tests/test-fetch.sh
          strict tests/test-dashboard.sh parts
          sudo ./build-linux/fs-hostnet-test
          strict tests/test-boot-start.sh
          strict tests/test-linux-install.sh
          strict tests/test-autostart.sh
          log="$(mktemp)"
          sudo bash tests/test-cli.sh > "$log" 2>&1 && rc=0 || rc=$?
          cat "$log"
          if grep -E '^skip: .*(root|script\(1\)|stty|unshare|C compiler|strace)' "$log"; then
            echo "::error::tests/test-cli.sh skipped root-only checks on CI"
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

      - name: Build and check the Linux tarball
        id: tarball
        working-directory: port
        run: |
          export STOCKFW_BUILD_DIR="$PWD/build-release"
          bash tools/build-linux.sh
          bash installer/linux/build_installer_linux.sh
          STOCKFW_REQUIRE_PACKAGE=1 bash tests/test-release.sh
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: StockFW-${{ steps.tarball.outputs.version }}-linux-x86_64
          path: |
            port/installer/linux/dist/StockFW-*-linux-x86_64.tar.gz
            port/installer/linux/dist/StockFW-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  windows-core:
    name: Windows core and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build core and tests
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build --target fs-txapply-test fs-perapp-test fs-netplace-test fs-feed-test fs-intelset-test fs-hostnet-test fs-fetch-spawn-test

      - name: Run core unit tests
        run: |
          cd port
          ./build/fs-txapply-test.exe
          ./build/fs-perapp-test.exe
          bash tests/test-core.sh
          bash tests/test-policyio.sh
          bash tests/test-eventstore.sh
          bash tests/test-winevt.sh

  windows-smokes-1a:
    name: Windows UI smokes group 1a
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build UI smokes group 1a
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build --target fs-ui-smoke fs-prefs-fake-smoke fs-hitview-smoke

      - name: Run UI smokes group 1a
        run: |
          cd port
          export STOCKFW_TRAY_SMOKE=1
          smokes="fs-ui-smoke fs-prefs-fake-smoke fs-hitview-smoke"
          for t in $smokes; do
            echo "== $t"
            ./build/$t.exe
          done

  windows-smokes-1b:
    name: Windows UI smokes group 1b
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build UI smokes group 1b
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build --target fs-simviz-smoke fs-theme-smoke fs-trustview-smoke

      - name: Run UI smokes group 1b
        run: |
          cd port
          export STOCKFW_TRAY_SMOKE=1
          smokes="fs-simviz-smoke fs-theme-smoke fs-trustview-smoke"
          for t in $smokes; do
            echo "== $t"
            ./build/$t.exe
          done

  windows-smokes-2:
    name: Windows UI smokes group 2
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
