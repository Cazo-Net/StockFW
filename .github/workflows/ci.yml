# StockFW continuous integration: build and test on Linux and on Windows
# (MSYS2 UCRT64, the toolchain the README documents), and keep the
# Windows installer and the Linux tarball each run produces, so a build
# can be tried without setting anything up first.  RELEASING.md takes
# the release assets from the run on main of the tagged commit.
#
# It runs for every pull request (on the pull request merged into its
# base, so what is tested is what merging would give), for pushes to
# main, and by hand from the Actions tab.  Work-in-progress branches
# without a pull request are not built.

name: StockFW CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          # librsvg2-common (the SVG image loader) and shared-mime-info
          # are only recommended by GTK, so --no-install-recommends leaves
          # them out, yet every desktop has them: the Adwaita theme draws
          # some of its marks (the radio bullet, for one) from SVG files.
          # Without the loader GTK warns, and the smoke tests count any
          # GTK warning as a failure.  fonts-dejavu-core is named, not
          # left to the runner image: the Help layout tests measure text,
          # and DejaVu Sans is wider than most, so they run in a known
          # wide font rather than whatever sans the image happens to have.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev \
            librsvg2-common shared-mime-info fonts-dejavu-core \
            iptables nftables xvfb xauth \
            xdotool stalonetray desktop-file-utils \
            liblzma-dev libssl-dev xz-utils \
            python3-location location libloc-database clang libclang-rt-dev \
            nsis gcc-mingw-w64-x86-64

      - name: Build
        run: |
          cmake -S port -B port/build-linux -G Ninja
          ninja -C port/build-linux

      - name: Core, adversarial and command-line tests
        working-directory: port
        run: |
          bash tests/test-core.sh
          bash tests/test-eventstore.sh
          bash tests/test-winevt.sh
          bash tests/test-adversarial.sh
          bash tests/test-cli.sh
          bash tests/test-logstart.sh
          bash tests/test-licence-texts.sh
          bash tests/test-uaf-analyze.sh
          ninja -C build-linux fs-intel-test fs-netplace-test fs-nftset-load \
            fs-whatif-test fs-feed-test fs-intelset-test fs-fetch-test \
            fs-hostnet-test fs-backend-probe
          ./build-linux/fs-intel-test
          ./build-linux/fs-netplace-test
          ./build-linux/fs-whatif-test
          ./build-linux/fs-feed-test
          ./build-linux/fs-intelset-test
          ./build-linux/fs-fetch-test golden
          # As the runner's user here; the root step below runs it again
          # for its live part.
          ./build-linux/fs-hostnet-test

      - name: Location database reader (libloc, IPFire's file, fuzzer)
        working-directory: port
        run: |
          # Every part runs here: STOCKFW_GEODB_REQUIRE makes a missing
          # tool a failure instead of a skip.
          ninja -C build-linux fs-geodb-test
          ./build-linux/fs-geodb-test tests/geodb
          STOCKFW_GEODB_REQUIRE=1 FUZZ_SECONDS=120 bash tests/test-geodb.sh

      - name: UI smoke tests on a virtual display
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
        run: |
          # fs-tray-smoke is left out on Linux: it checks that the icon
          # is embedded in a notification area, and a bare X server has
          # none.  The Windows job runs it.
          smokes="fs-ui-smoke fs-prefs-fake-smoke fs-hitview-smoke
                  fs-simviz-smoke fs-theme-smoke fs-trustview-smoke
                  fs-copilot-smoke fs-statusview-smoke fs-activity-smoke
                  fs-overview-place-smoke
                  fs-startup-smoke fs-traymenu-smoke fs-session-smoke
                  fs-help-smoke fs-intelview-smoke"
          ninja -C build-linux $smokes
          for t in $smokes; do
            echo "== $t"
            xvfb-run -a "./build-linux/$t"
          done

      - name: One instance, background start and --quit (real binary)
        working-directory: port
        env:
          NO_AT_BRIDGE: "1"
        run: |
          # As the runner's user: the backend is unavailable, so the app
          # cannot touch the firewall.  stalonetray stands in for the
          # notification area; xdotool reads which windows are on screen.
          ninja -C build-linux StockFW
          xvfb-run -a bash tests/test-instance.sh

      - name: Start at sign-in (XDG autostart entry)
        working-directory: port
        run: |
          bash tests/test-autostart.sh

      - name: Live firewall tests as root, each in a private network namespace
        working-directory: port
        run: |
          # These print SKIP and pass when root, iptables or nft is
          # missing.  Everything is installed here, so a skip means the
          # test did not run, and that fails the job.
          strict () {
            local log rc
            log="$(mktemp)"
            sudo bash "$1" > "$log" 2>&1 && rc=0 || rc=$?
            cat "$log"
            if grep -q '^SKIP' "$log"; then
              echo "::error::$1 was skipped on CI"
              return 1
            fi
            return "$rc"
          }
          # The threat-intel drivers run some checks as nobody, which
          # must be able to reach them: ubuntu-24.04 makes home
          # directories 0750, so every directory above the checkout gets
          # o+x (search only, nothing becomes readable).
          ninja -C build-linux fs-nftset-load fs-intelset-driver \
            fs-intel-backend-driver fs-intel-e2e-driver stockfw-intel-test \
            fs-fetch-test fs-hostnet-test
          d="$PWD"
          while [ "$d" != / ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          strict tests/test-apply-linux.sh
          strict tests/test-apply-dual.sh
          strict tests/test-nftset.sh
          strict tests/test-whatif-live.sh
          strict tests/test-logstart-events.sh
          strict tests/test-logstart-kmsg.sh
          # 1.0.7 threat intel and countries: the nft sets, the Linux
          # backend's slots, the engine end to end with real downloads
          # from a local HTTPS server, `stockfw intel', and the
          # downloader (curl as nobody), each in private namespaces.
          strict tests/test-intelset.sh
          strict tests/test-intel-backend.sh
          strict tests/test-intel-e2e.sh
          strict tests/test-intel-cli.sh
          strict tests/test-fetch.sh
          sudo ./build-linux/fs-hostnet-test
          # The boot unit and `stockfw start' as the unit runs it; the
          # Linux installer in a private mount namespace; start at
          # sign-in written as root on a user's behalf.
          strict tests/test-boot-start.sh
          strict tests/test-linux-install.sh
          strict tests/test-autostart.sh

      # The release tarball: its own Release build (the tests above ran
      # on the default RelWithDebInfo one), packaged and stripped by the
      # packager, then checked as a user gets it -- install.sh runnable
      # as ./install.sh, the version, the changelog, the licence list.
      # nsis and gcc-mingw-w64 above let test-release.sh compile
      # StockFW.nsi and the version resource here as well (windres needs
      # the MinGW preprocessor and windows.h, not binutils alone).
      - name: Build and check the Linux tarball
        id: tarball
        working-directory: port
        run: |
          export STOCKFW_BUILD_DIR="$PWD/build-release"
          bash tools/build-linux.sh
          bash installer/linux/build_installer_linux.sh
          STOCKFW_REQUIRE_PACKAGE=1 bash tests/test-release.sh
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: StockFW-${{ steps.tarball.outputs.version }}-linux-x86_64
          path: |
            port/installer/linux/dist/StockFW-*-linux-x86_64.tar.gz
            port/installer/linux/dist/StockFW-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows build, tests and installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build
        id: build
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Every test suite (tests/full-suite.sh)
        env:
          # The runner is elevated and its firewall service runs, so the
          # threat-intel test on the real Windows Firewall must run:
          # with this set, every SKIP of fs-intel-windows-test fails.
          STOCKFW_REQUIRE_WINDOWS_INTEL: "1"
        run: |
          cd port
          bash tests/full-suite.sh

      # The installer is built whenever the program built, even when a
      # test failed: the run stays red, and the installer is there to
      # look at the failure on a real machine.
      - name: Build the installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd port
          bash installer/build_installer.sh
          # Now that the runtime is staged, check it carries GLib's
          # spawn helpers (without them no netsh or event log call works).
          bash tests/test-installer-spawn.sh

      - name: Keep the installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: StockFW-windows-installer
          path: port/installer/nsis/StockFW-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
