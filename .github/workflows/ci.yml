            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build UI smokes group 2
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build --target fs-copilot-smoke fs-statusview-smoke fs-activity-smoke fs-overview-place-smoke fs-verdict-smoke fs-startup-smoke

      - name: Run UI smokes group 2
        run: |
          cd port
          export STOCKFW_TRAY_SMOKE=1
          smokes="fs-copilot-smoke fs-statusview-smoke fs-activity-smoke
                  fs-overview-place-smoke fs-verdict-smoke fs-startup-smoke"
          for t in $smokes; do
            echo "== $t"
            ./build/$t.exe
          done

  windows-smokes-3:
    name: Windows UI smokes group 3
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openssl

      - name: Build UI smokes group 3
        run: |
          cd port
          cmake -S . -B build -G Ninja
          cmake --build build --target fs-traymenu-smoke fs-session-smoke fs-help-smoke fs-intelview-smoke fs-whatif-start-smoke fs-sentinel-test fs-tray-smoke

      - name: Run UI smokes group 3
        run: |
          cd port
          export STOCKFW_TRAY_SMOKE=1
          smokes="fs-traymenu-smoke fs-session-smoke
                  fs-help-smoke fs-intelview-smoke fs-whatif-start-smoke
